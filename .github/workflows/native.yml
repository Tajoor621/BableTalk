name: Native builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nawah:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORT_DISABLE_TELEMETRY: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install transformers==4.49.0 onnx==1.17.0 onnxruntime==1.24.3
      - run: python scripts/export_nawah.py
      - uses: actions/upload-artifact@v4
        with:
          name: Nawah-ONNX-pack
          path: generated-assets/nawah/
          retention-days: 7
  android:
    needs: nawah
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - uses: actions/download-artifact@v4
        with:
          name: Nawah-ONNX-pack
          path: generated-assets/nawah
      - run: npm ci
      - run: npm test -- bpe
      - run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: BabelTalk-Android-development-test
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 7
  ios:
    needs: nawah
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: Nawah-ONNX-pack
          path: generated-assets/nawah
      - run: npm ci
      - run: npm test -- bpe
      - run: pod install
        working-directory: ios
      - run: xcodebuild -workspace BabelTalk.xcworkspace -scheme BabelTalk -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
        working-directory: ios
